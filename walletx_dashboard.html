<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>WalletX · Vault</title>
<style>
/* ══════════════════════════════════════════════════════════════
   WALLETX — Replit Dark Theme · Orange Accents · Card Layout
   ══════════════════════════════════════════════════════════════ */
:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --card:      #1a1e27;
  --border:    #30363d;
  --text:      #e6edf3;
  --dim:       #8b949e;
  --orange:    #ff8c00;
  --orange-bg: #2a1a00;
  --green:     #3fb950;
  --red:       #f85149;
  --blue:      #58a6ff;
  --gold:      #d2991d;
  --radius:    8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font:13px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow-x:hidden;min-height:100vh;
}
#app{max-width:1100px;margin:0 auto;padding:12px}

/* Header */
header{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;margin-bottom:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);
}
header .logo{font-size:20px;font-weight:700;color:var(--orange)}
header .logo span{color:var(--dim);font-size:12px;font-weight:400;margin-left:6px}
header .stat{font-size:11px;color:var(--dim);margin-left:auto}
header .stat b{color:var(--text);font-weight:600}

/* Tabs */
#tabs{
  display:flex;gap:2px;margin-bottom:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:4px;overflow-x:auto;
}
#tabs button{
  padding:10px 18px;background:transparent;color:var(--dim);
  border:none;border-radius:6px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:500;
  transition:all .15s;white-space:nowrap;
}
#tabs button:hover{color:var(--text);background:var(--card)}
#tabs button.active{background:var(--orange);color:#000;font-weight:700}

/* Panels */
.panel{display:none}
.panel.active{display:block}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:8px;
}

/* Stats row */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.stats .stat-card{
  flex:1;min-width:100px;padding:12px 16px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);text-align:center;
}
.stat-card .n{font-size:22px;font-weight:700;color:var(--green)}
.stat-card .l{font-size:11px;color:var(--dim);margin-top:2px}
.stat-card.warn .n{color:var(--orange)}
.stat-card.hit .n{color:var(--gold)}

/* Search bar */
.bar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.bar input,.bar select,.bar button,.bar textarea{
  padding:8px 12px;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);
  font:inherit;font-size:13px;outline:none;
  transition:border-color .15s;
}
.bar input:focus,.bar select:focus,.bar textarea:focus{border-color:var(--orange)}
.bar input{flex:1;min-width:120px}
.btn{
  padding:8px 16px;border:none;border-radius:var(--radius);
  cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  transition:all .15s;
}
.btn-o{background:var(--orange);color:#000}
.btn-o:hover{filter:brightness(1.15)}
.btn-o:active{filter:brightness(.9)}
.btn-o:disabled{opacity:.4;cursor:default}
.btn-d{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-d:hover{background:var(--card)}
.btn-r{background:transparent;color:var(--red);border:1px solid var(--red)}

/* Wallet list */
#leaderboard{overflow-y:auto;max-height:calc(100vh - 420px)}
.wallet{
  padding:10px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12px;
  transition:background .1s;
}
.wallet:hover{background:var(--surface)}
.wallet.active{background:var(--orange-bg);border-left:3px solid var(--orange)}
.wallet .r{color:var(--orange);font-weight:700;min-width:22px;font-size:12px}
.wallet .c{color:var(--blue);min-width:32px;font-size:10px;text-transform:uppercase}
.wallet .bal{color:var(--green);text-align:right;min-width:80px;font-weight:600}
.wallet .addr{color:var(--dim);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}

/* Vault table */
.vault-table{width:100%;border-collapse:collapse;font-size:11px}
.vault-table th{
  text-align:left;padding:8px 10px;color:var(--dim);font-weight:600;
  border-bottom:2px solid var(--border);font-size:10px;text-transform:uppercase;
}
.vault-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.vault-table tr:hover{background:var(--surface)}
.vault-table .type{color:var(--blue);font-weight:600}
.vault-table .key{font-family:'SF Mono','Fira Code',monospace;font-size:10px;word-break:break-all;max-width:200px}
.vault-table .addr{font-family:'SF Mono','Fira Code',monospace;font-size:10px;color:var(--dim)}
.vault-table .bal{color:var(--green);font-weight:700;text-align:right}
.vault-table .bal.zero{color:var(--dim)}
.vault-table .proof{color:var(--green);font-size:16px;text-align:center}
.vault-table .proof.fail{color:var(--red)}
.vault-table .actions{text-align:right}

/* Vault import */
.vault-import{width:100%;min-height:140px;font:11px 'SF Mono','Fira Code',monospace;
  background:var(--surface);color:var(--green);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;resize:vertical;
}
.vault-import:focus{border-color:var(--orange)}

/* Detail panel */
#detail{padding:12px}
#detail .section{margin-bottom:14px}
#detail .label{color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase;margin-bottom:4px;display:block}
#detail .val{word-break:break-all;font-size:12px;line-height:1.7;color:var(--gold);font-family:'SF Mono','Fira Code',monospace}

/* Toast */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--orange);color:#000;padding:10px 24px;
  border-radius:20px;font-weight:700;font-size:13px;
  display:none;z-index:999;box-shadow:0 4px 20px rgba(255,140,0,.3);
}
.result-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;margin-top:8px;font-size:11px;
  font-family:'SF Mono','Fira Code',monospace;white-space:pre-wrap;word-break:break-all;
}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Responsive */
@media(max-width:600px){
  .stats{flex-direction:column}
  .wallet .addr{display:none}
  #leaderboard{max-height:calc(100vh - 520px)}
}
</style>
</head>
<body>
<div id="app">

<header>
  <div class="logo">🦖 WalletX <span>v2 · Vault Edition</span></div>
  <div class="stat" id="hdrStats">Loading…</div>
</header>

<div id="tabs">
  <button class="active" onclick="switchTab('wallets',this)">💰 Wallets</button>
  <button onclick="switchTab('vault',this)">📦 Vault</button>
  <button onclick="switchTab('send',this)">📤 Send</button>
  <button onclick="switchTab('receive',this)">📥 Receive</button>
  <button onclick="switchTab('swap',this)">🔄 Swap</button>
  <button onclick="switchTab('bridge',this)">🌉 Bridge</button>
</div>

<!-- ═══════════════════ WALLETS TAB ═══════════════════ -->
<div id="tab-wallets" class="panel active">
  <div class="stats" id="wstat"></div>
  <div class="bar">
    <input id="q" placeholder="Search address…" onkeyup="if(event.key==='Enter')load()">
    <select id="sortBy" onchange="load()">
      <option value="balance">Balance ↓</option><option value="chain">Chain</option>
      <option value="ts">Recent</option>
    </select>
    <select id="chainFilter" onchange="load()">
      <option value="">All chains</option>
      <option>eth</option><option>btc</option><option>sol</option>
      <option>matic</option><option>bnb</option><option>base</option>
      <option>arb</option><option>avax</option>
    </select>
    <button class="btn btn-o" onclick="load()">🔍 Search</button>
    <button class="btn btn-d" onclick="doRefresh()">🔄 Refresh</button>
  </div>
  <div id="leaderboard"></div>
  <div class="flex" style="justify-content:center;gap:12px;padding:8px">
    <button class="btn btn-d" onclick="prevPage()">◀ Prev</button>
    <span id="pageInfo" style="color:var(--dim);font-size:12px">Page 1</span>
    <button class="btn btn-d" onclick="nextPage()">Next ▶</button>
  </div>
  <div id="detail" class="card" style="margin-top:8px;min-height:100px">
    <div style="color:var(--dim);text-align:center;padding:40px">👆 Select a wallet to see keys &amp; details</div>
  </div>
</div>

<!-- ═══════════════════ VAULT TAB ═══════════════════ -->
<div id="tab-vault" class="panel">
  <div class="stats" id="vstat"></div>
  <div class="card">
    <div style="font-weight:700;color:var(--orange);margin-bottom:8px">🔑 Bulk Import Keys</div>
    <textarea class="vault-import" id="vaultPaste" placeholder="Paste BIP39 seed phrases, hex private keys, WIF keys, or PEM — one per line or separated by spaces…
Examples:
  abandon ability able about above absent absorb abstract absurd abuse access accident …
  0x4c0883a69102937d6231471b5dbb6204fe5129617082792ae468d01a3f362318
  5KQwrPbwdL6PhXujxW37FSSQZ1JiwsST4cqQzDeyXtP79zkvFD3
  -----BEGIN EC PRIVATE KEY----- … -----END EC PRIVATE KEY-----"></textarea>
    <div class="flex" style="margin-top:8px;justify-content:space-between">
      <span style="color:var(--dim);font-size:11px" id="vaultHint">Paste any crypto key format — auto-detected</span>
      <button class="btn btn-o" id="vaultImportBtn" onclick="doVaultImport()">⚡ Import &amp; Scan Now</button>
    </div>
    <div id="vaultResult" class="result-box" style="display:none"></div>
  </div>

  <div class="card">
    <div style="font-weight:700;color:var(--orange);margin-bottom:8px">🗄️ Forever Vault <span style="font-size:11px;color:var(--dim);font-weight:400">— key → address proof</span></div>
    <div class="flex" style="justify-content:space-between;margin-bottom:8px">
      <span style="color:var(--dim);font-size:11px" id="vaultCount">Loading…</span>
      <div class="flex" style="gap:4px">
        <button class="btn btn-d" onclick="loadVault()">🔄 Refresh</button>
        <button class="btn btn-r" onclick="doVaultClear()" style="font-size:11px">🗑 Clear All</button>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="vault-table" id="vaultTable">
        <thead><tr>
          <th>Type</th><th>Key Preview</th><th>Address</th><th>Chain</th>
          <th>Balance</th><th>Proof</th><th></th>
        </tr></thead>
        <tbody id="vaultBody">
          <tr><td colspan="7" style="text-align:center;color:var(--dim);padding:20px">Loading vault…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══════════════════ SEND TAB ═══════════════════ -->
<div id="tab-send" class="panel">
  <div class="card">
    <div class="form-row"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Chain</label>
      <select id="sendChain" class="bar" style="width:100%;margin-top:4px">
        <option value="eth">ETH</option><option value="btc">BTC</option><option value="sol">SOL</option>
        <option value="matic">MATIC</option><option value="bnb">BNB</option><option value="base">BASE</option>
      </select></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Private Key</label>
      <input id="sendKey" type="password" placeholder="Hex private key" style="width:100%;margin-top:4px" class="bar"></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">To Address</label>
      <input id="sendTo" placeholder="Destination address" style="width:100%;margin-top:4px" class="bar"></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Amount</label>
      <input id="sendAmt" placeholder="0.001" type="number" step="any" style="width:100%;margin-top:4px" class="bar"></div>
    <button class="btn btn-o" onclick="doSend()" style="margin-top:12px;width:100%">📤 Send Transaction</button>
    <div id="sendResult" class="result-box" style="display:none"></div>
  </div>
</div>

<!-- ═══════════════════ RECEIVE TAB ═══════════════════ -->
<div id="tab-receive" class="panel">
  <div class="card">
    <div class="form-row"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Private Key</label>
      <input id="recvKey" type="password" placeholder="64-char hex private key or seed phrase" style="width:100%;margin-top:4px" class="bar"></div>
    <button class="btn btn-o" onclick="doReceive()" style="margin-top:12px;width:100%">📥 Derive All Addresses</button>
    <div id="recvResult" class="result-box" style="display:none"></div>
  </div>
</div>

<!-- ═══════════════════ SWAP TAB ═══════════════════ -->
<div id="tab-swap" class="panel">
  <div class="card">
    <div class="form-row"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Chain</label>
      <select id="swapChain" onchange="updateSwapTokens()" style="width:100%;margin-top:4px" class="bar">
        <option value="eth">ETH</option><option value="matic">MATIC</option>
        <option value="bnb">BNB</option><option value="base">BASE</option><option value="arb">ARB</option>
      </select></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">From</label>
      <select id="swapFrom" style="width:100%;margin-top:4px" class="bar"></select></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">To</label>
      <select id="swapTo" style="width:100%;margin-top:4px" class="bar"></select></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Amount</label>
      <input id="swapAmt" placeholder="0.01" type="number" step="any" style="width:100%;margin-top:4px" class="bar"></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Wallet Address</label>
      <input id="swapAddr" placeholder="Your wallet address" style="width:100%;margin-top:4px" class="bar"></div>
    <button class="btn btn-o" onclick="doSwapQuote()" style="margin-top:12px;width:100%">🔄 Get Quote</button>
    <div id="swapResult" class="result-box" style="display:none"></div>
  </div>
</div>

<!-- ═══════════════════ BRIDGE TAB ═══════════════════ -->
<div id="tab-bridge" class="panel">
  <div class="card">
    <div class="form-row"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">From Chain</label>
      <select id="bridgeFrom" style="width:100%;margin-top:4px" class="bar">
        <option value="eth">ETH</option><option value="matic">MATIC</option><option value="bnb">BNB</option>
        <option value="avax">AVAX</option><option value="base">BASE</option><option value="arb">ARB</option>
      </select></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">To Chain</label>
      <select id="bridgeTo" style="width:100%;margin-top:4px" class="bar">
        <option value="base">BASE</option><option value="arb">ARB</option><option value="matic">MATIC</option>
        <option value="bnb">BNB</option><option value="eth">ETH</option>
      </select></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Token</label>
      <input id="bridgeToken" value="ETH" placeholder="ETH/USDC" style="width:100%;margin-top:4px" class="bar"></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Amount</label>
      <input id="bridgeAmt" placeholder="0.01" type="number" step="any" style="width:100%;margin-top:4px" class="bar"></div>
    <div class="form-row" style="margin-top:8px"><label style="color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase">Address</label>
      <input id="bridgeAddr" placeholder="Your wallet address" style="width:100%;margin-top:4px" class="bar"></div>
    <button class="btn btn-o" onclick="doBridgeQuote()" style="margin-top:12px;width:100%">🌉 Get Bridge Quote</button>
    <div id="bridgeResult" class="result-box" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// TAB SWITCHING
// ═══════════════════════════════════════════════════════════════
function switchTab(name,btn){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
  if(name==='wallets')load();
  if(name==='vault'){loadVaultStats();loadVault();}
}

// ═══════════════════════════════════════════════════════════════
// SHARED
// ═══════════════════════════════════════════════════════════════
function toast(m){
  let t=document.getElementById('toast');t.textContent=m;t.style.display='block';
  setTimeout(()=>t.style.display='none',2200);
}
function copyAddr(a){navigator.clipboard.writeText(a).then(()=>toast('Copied!'));}
function fmtBal(n){if(n===null||n===undefined)return'$0.00';let v=Number(n);if(v<0.0001&&v>0)return'<0.0001';return v.toFixed(v<1?6:2);}

// ═══════════════════════════════════════════════════════════════
// WALLETS TAB
// ═══════════════════════════════════════════════════════════════
let PAGE=0,PERPAGE=50,TOTAL=0,focus=null,wallets=[],autoTimer=null;

async function load(){
 try{
  let u=`/api/balances?limit=${PERPAGE}&offset=${PAGE*PERPAGE}&funded_only=true&keyed_only=true&sort_by=${document.getElementById('sortBy').value}`;
  let c=document.getElementById('chainFilter').value;if(c)u+=`&chain=${c}`;
  if(document.getElementById('q').value)u=`/api/search?q=${encodeURIComponent(document.getElementById('q').value)}&limit=${PERPAGE}&offset=${PAGE*PERPAGE}`;
  let r=await fetch(u),d=await r.json();
  wallets=d.rows||[];TOTAL=d.total||0;
  let s=await fetch('/api/stats').then(r=>r.json());
  document.getElementById('wstat').innerHTML=
    `<div class="stat-card"><div class="n">${s.keyed_funded||s.nonzero||0}</div><div class="l">💰 Funded Wallets</div></div>`+
    `<div class="stat-card hit"><div class="n">${s.keyed_total||s.total||0}</div><div class="l">🔑 Keyed Addresses</div></div>`+
    `<div class="stat-card warn"><div class="n">${s.hits||0}</div><div class="l">✨ Total Hits</div></div>`;
  document.getElementById('hdrStats').innerHTML=`<b>${s.keyed_funded||s.nonzero||0}</b> funded · <b>${s.keyed_total||s.total||0}</b> keyed · <b>${s.hits||0}</b> hits`;
  renderLB();
 }catch(e){console.error(e)}
}
function renderLB(){
 let lb=document.getElementById('leaderboard'),html='';
 wallets.forEach((w,i)=>{
  let bal=w.total_usd||w.balance||0,cls=focus&&focus.address===w.address?' active':'';
  html+=`<div class="wallet${cls}" onclick="showDetail(${i})">
    <span class="r">${PAGE*PERPAGE+i+1}</span>
    <span class="c">${(w.chain||'?').toUpperCase()}</span>
    <span class="bal">$${fmtBal(bal)}</span>
    <span class="addr">${w.address||'?'}</span>
  </div>`;
 });
 lb.innerHTML=html||'<div style="color:var(--dim);text-align:center;padding:40px">No funded wallets yet — keep scanning</div>';
 document.getElementById('pageInfo').textContent=`Page ${PAGE+1} · ${TOTAL} total`;
}
function prevPage(){if(PAGE>0){PAGE--;load()}}
function nextPage(){if((PAGE+1)*PERPAGE<TOTAL){PAGE++;load()}}

async function showDetail(i){
 focus=wallets[i];renderLB();
 let d=document.getElementById('detail');
 try{
  let r=await fetch('/api/wallet/'+focus.address),kd=await r.json();
  d.innerHTML=
    `<div class="section"><span class="label">Address</span><span class="val">${focus.address} <button class="btn btn-d" style="font-size:10px;padding:2px 8px;margin-left:8px" onclick="copyAddr('${focus.address}')">📋 Copy</button></span></div>`+
    `<div class="section"><span class="label">Balance</span><span class="val">$${fmtBal(kd.total_usd||focus.total_usd||0)}</span></div>`;
  if(kd.keys&&kd.keys.length){
   d.innerHTML+=`<div class="section"><span class="label">🔑 Private Keys (${kd.keys.length})</span>`;
   kd.keys.forEach(k=>{
    d.innerHTML+=`<div class="val" style="font-size:11px;margin-bottom:4px">
      <span style="color:var(--blue)">${k.type||'hex'}</span>: ${k.value||k}
      <button class="btn btn-d" style="font-size:9px;padding:1px 6px;margin-left:4px" onclick="copyAddr('${(k.value||k).replace(/'/g,"\\'")}')">📋</button>
    </div>`;
   });
   d.innerHTML+=`</div>`;
  }
  if(kd.chains){
   d.innerHTML+=`<div class="section"><span class="label">🌐 Chain Balances</span>`;
   Object.entries(kd.chains).forEach(([ch,bal])=>{
    d.innerHTML+=`<div class="val">${ch.toUpperCase()}: ${Number(bal).toFixed(8)} <span style="color:${Number(bal)>0?'var(--green)':'var(--dim)'}">${Number(bal)>0?'● funded':'○ empty'}</span></div>`;
   });
   d.innerHTML+=`</div>`;
  }
 }catch(e){d.innerHTML=`<div style="color:var(--red)">Error loading details: ${e}</div>`}
}

async function doRefresh(){
 toast('🔄 Refreshing balances…');
 try{await fetch('/api/refresh-balances',{method:'POST'});toast('✅ Refresh started — check back in a few seconds')}
 catch(e){toast('❌ Refresh failed')}

// ═══════════════════════════════════════════════════════════════
// VAULT TAB
// ═══════════════════════════════════════════════════════════════
async function loadVaultStats(){
 try{
  let r=await fetch('/api/vault/stats'),d=await r.json();
  document.getElementById('vstat').innerHTML=
    `<div class="stat-card"><div class="n">${d.total||0}</div><div class="l">🔑 Keys in Vault</div></div>`+
    `<div class="stat-card hit"><div class="n">${d.funded||0}</div><div class="l">💰 Funded</div></div>`+
    `<div class="stat-card"><div class="n">${d.verified||0}</div><div class="l">✅ Verified Proofs</div></div>`;
  document.getElementById('vaultCount').textContent=`${d.total||0} keys stored · ${d.funded||0} funded · ${d.verified||0} address proofs verified`;
 }catch(e){}
}

async function loadVault(){
 try{
  let r=await fetch('/api/vault/list'),d=await r.json();
  let rows=d.rows||[],html='';
  rows.forEach(v=>{
   let balCls=v.balance>0?'':' zero';
   let proofIcon=v.proof_verified?'✅':'❌';
   let proofCls=v.proof_verified?'proof':'proof fail';
   html+=`<tr>
     <td class="type">${v.key_type||'?'}</td>
     <td class="key" title="${v.key_value||''}">${(v.key_value||'').slice(0,24)}…</td>
     <td class="addr">${(v.address||'').slice(0,14)}… <button class="btn btn-d" style="font-size:8px;padding:1px 4px" onclick="copyAddr('${(v.address||'').replace(/'/g,"\\'")}')">📋</button></td>
     <td style="color:var(--blue);font-size:10px">${(v.chain||'?').toUpperCase()}</td>
     <td class="bal${balCls}">$${fmtBal(v.balance)}</td>
     <td class="${proofCls}" title="${v.proof_verified?'Key→Address verified':'Not verified'}">${proofIcon}</td>
     <td class="actions"><button class="btn btn-r" style="font-size:9px;padding:2px 6px" onclick="doVaultDelete('${v.id}')">🗑</button></td>
   </tr>`;
  });
  document.getElementById('vaultBody').innerHTML=html||
    '<tr><td colspan="7" style="text-align:center;color:var(--dim);padding:20px">Vault is empty — paste keys above and import</td></tr>';
  loadVaultStats();
 }catch(e){console.error(e)}
}

async function doVaultImport(){
 let txt=document.getElementById('vaultPaste').value.trim();
 if(!txt){toast('⚠️ Paste keys first');return}
 let btn=document.getElementById('vaultImportBtn');
 btn.disabled=true;btn.textContent='⏳ Scanning…';
 document.getElementById('vaultResult').style.display='block';
 document.getElementById('vaultResult').textContent='Detecting key types, deriving addresses, checking balances…';
 try{
  let resp=await fetch('/api/vault/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw:text})});
  let d=await resp.json();
  if(d.ok){
   document.getElementById('vaultResult').textContent=
     `✅ Import complete!\n\n`+
     `   Keys found:   ${d.found||0}\n`+
     `   Imported:     ${d.imported||0}\n`+
     `   Funded:       ${d.funded||0} 💰\n`+
     `   Empty ($0.00): ${d.empty||0} 💀\n`+
     `   Errors:       ${d.errors||0}\n\n`+
     (d.samples||[]).map(s=>`   ${s.type}: ${s.preview} → ${s.address} → ${s.balance>0?'💎 $'+fmtBal(s.balance):'💀 $0.00'}`).join('\n');
   document.getElementById('vaultPaste').value='';
   loadVault();
   toast(`✅ ${d.imported||0} keys imported · ${d.funded||0} funded!`);
  }else{
   document.getElementById('vaultResult').textContent='❌ Import failed: '+(d.error||'unknown');
   toast('❌ Import failed');
  }
 }catch(e){
  document.getElementById('vaultResult').textContent='❌ Error: '+e;
  toast('❌ Import error');
 }
 btn.disabled=false;btn.textContent='⚡ Import & Scan Now';
}

async function doVaultDelete(id){
 if(!confirm('Delete this key from the vault?'))return;
 try{
  await fetch('/api/vault/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  toast('🗑 Deleted');
  loadVault();
 }catch(e){toast('❌ Delete failed')}
}

async function doVaultClear(){
 if(!confirm('⚠️ Delete ALL keys from the forever vault? This cannot be undone.'))return;
 try{
  await fetch('/api/vault/clear',{method:'POST'});
  toast('🗑 Vault cleared');
  loadVault();
 }catch(e){toast('❌ Clear failed')}
}

// ═══════════════════════════════════════════════════════════════
// SEND TAB
// ═══════════════════════════════════════════════════════════════
async function doSend(){
 let chain=document.getElementById('sendChain').value;
 let key=document.getElementById('sendKey').value.trim();
 let to=document.getElementById('sendTo').value.trim();
 let amt=document.getElementById('sendAmt').value;
 if(!key||!to||!amt){toast('⚠️ Fill all fields');return}
 document.getElementById('sendResult').style.display='block';
 document.getElementById('sendResult').textContent='Sending…';
 try{
  let resp=await fetch('/api/send-multi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chain,private_key:key,to,amount:parseFloat(amt)})});
  let d=await resp.json();
  document.getElementById('sendResult').textContent=d.ok?`✅ Sent! TX: ${d.txid||d.result||'ok'}`:`❌ ${d.error||'Failed'}`;
 }catch(e){document.getElementById('sendResult').textContent='❌ '+e}
}

// ═══════════════════════════════════════════════════════════════
// RECEIVE TAB
// ═══════════════════════════════════════════════════════════════
async function doReceive(){
 let key=document.getElementById('recvKey').value.trim();
 if(!key){toast('⚠️ Enter a private key');return}
 document.getElementById('recvResult').style.display='block';
 document.getElementById('recvResult').textContent='Deriving addresses…';
 try{
  let resp=await fetch('/api/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({private_key:key})});
  let d=await resp.json();
  if(d.error){document.getElementById('recvResult').textContent='❌ '+d.error;return}
  let out='📥 Derived Addresses:\n\n';
  Object.entries(d.addresses||d).forEach(([ch,addr])=>{
   if(typeof addr==='string')out+=`  ${ch.toUpperCase()}: ${addr}\n`;
  });
  document.getElementById('recvResult').textContent=out;
 }catch(e){document.getElementById('recvResult').textContent='❌ '+e}
}
